# Yellow River Digital Twin Configuration

project:
  name: "Yellow River Digital Twin"
  version: "0.1.0"

# Data paths
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  external_dir: "data/external"

# Target variables to predict
targets:
  - water_level      # 水位
  - sediment_content # 泥沙含量

# Model parameters
model:
  type: "lstm"  # or "gru", "transformer"
  sequence_length: 30
  hidden_units: 64
  dropout_rate: 0.2
  learning_rate: 0.001
  batch_size: 32
  epochs: 100

# Features to use
features:
  temporal:
    - date
    - season
  hydrological:
    - upstream_flow
    - rainfall
    - temperature
  historical:
    - lag_1d
    - lag_7d
    - lag_30d
