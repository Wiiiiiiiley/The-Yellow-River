# 智慧黄河防汛决策系统 v2.0 配置

# 数据配置
data:
  stations:
    - id: "HYD_001"
      name: "兰州"
      location: [36.0611, 103.8343]
    - id: "HYD_002"
      name: "河口镇"
      location: [35.7897, 110.2406]
    - id: "HYD_003"
      name: "龙门"
      location: [35.1064, 110.5921]
    - id: "HYD_004"
      name: "三门峡"
      location: [34.7753, 111.1934]
    - id: "HYD_005"
      name: "花园口"
      location: [34.9031, 113.1889]
  
  # 数据源优先级
  sources:
    - type: "sqlite"
      path: "data/autopilot.db"
    - type: "csv"
      path: "data/archive/"
    - type: "api"
      endpoint: "http://localhost:8000/api"
    - type: "simulated"
      enabled: true

# 模型配置
models:
  # GNN-Transformer 配置
  gnn_transformer:
    node_features: 6
    gnn_hidden: 64
    gnn_layers: 3
    transformer_heads: 8
    transformer_layers: 4
    dropout: 0.1
    sequence_length: 24
    prediction_horizon: 6
  
  # PINN 配置
  pinn:
    physics_weight: 0.5
    data_weight: 0.5
    adaptive_weight: true
    physics_threshold: 0.1
    manning_coefficient: 0.03
    bed_slope: 0.0001
    
  # RL 配置
  rl:
    algorithm: "PPO"
    state_dim: 19
    action_dim: 5
    learning_rate: 3e-4
    gamma: 0.99
    gae_lambda: 0.95

# 训练配置
training:
  epochs: 1000
  batch_size: 32
  learning_rate: 1e-3
  early_stopping_patience: 50
  validation_split: 0.2
  
  # L-BFGS 二阶优化（个性学习）
  lbfgs:
    enabled: true
    iterations: 200
    line_search_fn: "strong_wolfe"

# 预测配置
prediction:
  input_window: 24        # 输入窗口（小时）
  output_window: 6        # 输出窗口（小时）
  batch_prediction: true
  uncertainty_quantile: 0.95

# AutoPilot 配置
autopilot:
  enabled: true
  
  # 自动下载
  downloader:
    schedule: "cron[0 2 * * *]"  # 每日凌晨 2: 00
    retry_attempts: 3
    timeout: 300
  
  # 自动训练
  training:
    trigger_days: 7
    history_buffer_ratio: 0.2
    incremental: true
  
  # 自动进化
  evolution:
    physics_residual_threshold: 0.1
    improvement_threshold: 0.05
    auto_promotion: true
    monthly_backtrack: true
  
  # 自动报告
  reporting:
    enabled: true
    schedule: "cron[0 8 * * *]"  # 每日上午 8: 00
    format: "markdown"

# 仪表板配置
dashboard:
  port: 8501
  refresh_interval: 5  # 秒（实时模式）
  theme: "light"
  
  # Dashboard v2 特性
  features:
    system_status: true
    evolution_tracking: true
    multimodal_monitoring: true
    rl_recommendations: true
    vision_intelligence: true

# 监控配置
monitoring:
  enabled: true
  log_level: "INFO"
  metrics_collection: true
  
  # 实时传感器
  sensors:
    update_frequency: 3600  # 秒（1 小时）
    anomaly_detection: true
    alert_threshold: 0.8

# 物理约束参数
physics:
  gravity: 9.81
  friction_model: "manning"
  manning_coefficient: 0.03
  bed_slope: 0.0001
  river_width: 500.0  # 米
  
  # Saint-Venant 方程系数
  continuity_weight: 1.0
  momentum_weight: 1.0

# 数据验证
validation:
  missing_value_threshold: 0.1
  outlier_detection: true
  outlier_std: 3.0

# 输出配置
output:
  save_models: true
  model_dir: "models/autopilot/"
  save_predictions: true
  prediction_dir: "results/predictions/"
  save_reports: true
  report_dir: "results/reports/"

# 版本控制
version: "2.0.0"
build_date: "2024-04-19"
