# Smart Yellow River Flood Management System Configuration
# ===========================================================

system:
  name: "Smart Yellow River Flood Management System"
  version: "1.0.0"
  log_level: "INFO"
  device: "auto"  # auto, cuda, cpu

data:
  # Real-time API endpoints
  api_endpoints:
    hydrology: "https://api.yellowriver.gov/hydrology/v1/realtime"
    meteorology: "https://api.weather.gov.cn/yellow-river/forecast"
    satellite: "https://api.satellite.yellowriver.gov/rainfall"
  
  # Data update frequency (seconds)
  update_interval_sec: 300  # 5 minutes
  
  # Historical data buffer
  buffer_size: 10000
  
  # Feature normalization
  normalization:
    method: "standard"  # standard, minmax, robust
    feature_range: [-1, 1]
  
  # Node features
  node_features: 
    - "water_level"
    - "flow_rate" 
    - "sediment_content"
    - "rainfall"
    - "temperature"
    - "wind_speed"
  
  # Edge features (river segments)
  edge_features:
    - "distance_km"
    - "slope"
    - "channel_width"
    - "roughness"

model:
  # Graph-Transformer Architecture
  graph_transformer:
    in_channels: 6
    hidden_channels: 128
    out_channels: 2  # water_level, sediment
    num_gnn_layers: 3
    transformer_heads: 8
    transformer_layers: 2
    temporal_window: 24  # hours
    dropout: 0.1
    use_informer: true  # Use efficient attention
    
    # Pretrained checkpoint (optional)
    pretrained_checkpoint: null
  
  # Physics Constraints
  physics:
    gravity: 9.8          # m/s²
    manning_n: 0.03       # Roughness coefficient
    bed_slope: 0.001      # S0
    channel_width: 50.0   # B (meters)
    alpha_continuity: 1.0
    alpha_momentum: 1.0
    tolerance: 0.1        # Physics residual tolerance
    
    # Adaptive physics weighting
    use_adaptive: true
    warmup_epochs: 50
    initial_weight: 0.1
    final_weight: 1.0

rl:
  # PPO Hyperparameters
  learning_rate: 3.0e-4
  gamma: 0.99           # Discount factor
  gae_lambda: 0.95        # GAE parameter
  clip_epsilon: 0.2       # PPO clip range
  value_coef: 0.5         # Value loss weight
  entropy_coef: 0.01      # Entropy bonus weight
  
  # Network architecture
  hidden_dims: [256, 256, 128]
  batch_size: 64
  epochs_per_update: 10
  
  # Environment
  max_steps_per_episode: 168  # 1 week
  
  # Control targets
  target_level_range: [45.0, 55.0]  # meters
  
  # Safety constraints
  safety_constraints:
    max_level: 65.0      # Critical flood level
    min_level: 35.0      # Drought level
    max_discharge: 5000.0  # Max release capacity
    min_discharge: 500.0   # Min ecological flow
  
  # Pretrained policy (optional)
  pretrained_policy: null

ensemble:
  # Multi-model verification
  model_paths:
    - "models/pinn_v2/PINN_SOTA/best_model_lbfgs.pt"
    - "models/pinn_v2/Baseline/best_model.pt"
    - "models/pinn_v2/Sensitive_n/best_model_lbfgs.pt"
  
  divergence_threshold: 0.10  # 10% difference threshold
  
  # Consensus weights
  model_weights: [0.5, 0.3, 0.2]  # SOTA, Baseline, Sensitive_n

simulator:
  # Fast hydraulic simulator
  spatial_resolution: 1000.0   # meters
  time_resolution: 60.0         # seconds
  use_gpu: true
  
  # Parallel Monte Carlo
  n_scenarios: 100  # For risk assessment

dashboard:
  # Streamlit Dashboard
  port: 8501
  refresh_interval: 300  # seconds
  
  # Alert thresholds
  alert_levels:
    normal: [0, 45]
    warning: [45, 55]
    critical: [55, 65]
    emergency: [65, 100]
  
  # Visualization
  map_center: [34.5, 110.0]  # Yellow River central coordinates
  map_zoom: 8

inference:
  # Performance targets
  max_latency_ms: 60000  # 60 seconds end-to-end
  
  # Quality thresholds
  min_confidence: 0.8
  max_physics_residual: 1.0
  
  # Auto-decision rules
  auto_decision:
    enabled: true
    min_confidence: 0.85
    max_divergence: 0.05

training:
  # Prediction model training
  epochs: 200
  batch_size: 32
  learning_rate: 0.001
  
  # Validation
  val_ratio: 0.2
  early_stop_patience: 30
  
  # Checkpointing
  save_interval: 10
  
  # RL training
  rl_episodes: 10000
  eval_interval: 100

# Evolution Engine (Autonomous Self-Improvement)
evolution_config: "configs/evolution_config.yaml"
evolution_models_dir: "models/evolution/"

# Vision Intelligence (Multimodal CV for Dike Safety)
vision:
  enabled: true
  vit_model: "google/vit-base-patch16-224"
  sam_api_endpoint: null  # Set to SAM API endpoint if available
  gemini_api_key: null    # Set to Gemini API key for LLM diagnosis
  alert_threshold: 0.8      # 80% confidence to trigger alert
  warning_water_level: 55.0
  critical_water_level: 65.0
  drone_feed_port: 8080

# System Integration
integration:
  # Downstream systems
  notification:
    sms_enabled: true
    email_enabled: true
    webhook_url: "https://alerts.flood-control.gov/webhook"
  
  # Database
  database:
    type: "postgresql"
    host: "localhost"
    port: 5432
    name: "flood_management"
  
  # Cache
  cache:
    type: "redis"
    host: "localhost"
    port: 6379
    ttl: 3600
