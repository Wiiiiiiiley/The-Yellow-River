# 进化引擎配置
evolution:
  # 错误反馈循环
  error_monitoring:
    enabled: true
    check_frequency: 3600  # 秒
    error_threshold: 0.15  # 15% RMSE
  
  # 困难样本挖掘
  hard_sample_mining:
    enabled: true
    error_percentile: 90
    sample_ratio: 0.2
  
  # 自动校准
  physics_calibration:
    enabled: true
    residual_threshold: 0.1
    learning_rate: 0.001
    iterations: 100
    params_to_calibrate:
      - "manning_coefficient"  # 曼宁系数
      - "bed_slope"             # 河床坡度
      - "river_width"           # 河宽
  
  # 增量学习
  incremental_learning:
    enabled: true
    learning_rate_ratio: 0.1  # 相对原 LR 的 10%
    layers_to_finetune:
      - "transformer_encoder"
      - "spatial_attention"
  
  # A/B 测试
  ab_testing:
    enabled: true
    improvement_threshold: 0.05  # 5% 性能提升
    test_duration: 86400  # 秒（1 天）
    max_concurrent_models: 2
  
  # 进化轨迹
  evolution_tracking:
    enabled: true
    save_history: true
    history_file: "results/evolution_history.json"
    visualization: true

# 版本管理
versioning:
  major: 2
  minor: 0
  patch: 0
  build_counter: 0
  version_format: "v{major}.{minor}.{patch}-Evolved"

# 性能基准
benchmarks:
  target_latency: 60  # 秒
  target_physics_residual: 0.1
  target_model_divergence: 0.10  # 10%
  target_rl_throughput: 500  # steps/s
