# Evolution Engine Configuration
# ==============================
# Autonomous self-improvement settings for continuous model evolution

evolution:
  enabled: true
  
  # Error Detection
  anomaly_detection:
    error_threshold: 0.15        # 15% prediction error threshold
    physics_threshold: 1.0         # Physics residual threshold
    window_size: 100              # Rolling statistics window
    
  # Hard Examples Storage
  hard_examples:
    min_buffer_size: 50           # Trigger retraining when reached
    max_buffer_size: 500          # Max examples to keep
    save_path: "data/evolution/hard_examples.json"
    
  # Auto-Calibration
  calibration:
    enabled: true
    initial_S0: 0.001             # Initial bed slope
    initial_B: 50.0               # Initial channel width
    learning_rate: 0.001
    window_hours: 48              # Data window for calibration
    interval_hours: 24            # Check interval
    
    # Physical parameter bounds
    S0_bounds: [0.0001, 0.01]
    B_bounds: [20.0, 100.0]
    
  # Incremental Learning
  incremental_learning:
    enabled: true
    min_hard_examples: 50         # Min examples to trigger retrain
    learning_rate: 1.0e-5         # Low LR for fine-tuning
    batch_size: 16
    max_epochs: 10
    patience: 3                   # Early stopping patience
    
    # Which layers to update
    trainable_layers:
      - "attention"              # Only update attention layers
      - "temporal"
    
    freeze_others: true
    
  # Model Versioning
  versioning:
    enabled: true
    models_dir: "models/evolution/"
    promotion_threshold: 0.05     # 5% improvement required
    keep_versions: 5              # Number of versions to keep
    
  # Evolution Reporting
  reporting:
    enabled: true
    report_interval_hours: 24
    dashboard_update: true
    save_path: "results/evolution/"
    
  # Background Thread
  threading:
    check_interval_sec: 60        # Evolution loop interval
    daemon: true                  # Run as daemon thread
